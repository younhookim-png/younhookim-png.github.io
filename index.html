<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>샤방샤방 땅따먹기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffd6ec;--bg2:#d9d4ff;--bg3:#c6f0ff;--ink:#6b4f8f;--glass:rgba(255,255,255,.6);--board:#fff8fd;--grid:rgba(190,160,230,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a2f5e;--bg2:#2f2e63;--bg3:#244560;--ink:#ffeaff;--glass:rgba(255,255,255,.14);--board:#2b2447;--grid:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--bg1:#4a2f5e;--bg2:#2f2e63;--bg3:#244560;--ink:#ffeaff;--glass:rgba(255,255,255,.14);--board:#2b2447;--grid:rgba(255,255,255,.07)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex:none}
h1{margin:0;font-weight:400;font-size:clamp(20px,5vw,30px);text-shadow:0 0 14px rgba(255,255,255,.9)}
.hud{display:flex;gap:8px}
.chip{background:var(--glass);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:6px 14px;font-size:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px 8px}
canvas{display:block;border-radius:18px;box-shadow:0 10px 40px rgba(180,140,255,.45),0 0 0 3px rgba(255,255,255,.8);touch-action:none;background:var(--board)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.card{pointer-events:auto;text-align:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:26px 28px;max-width:340px;box-shadow:0 12px 40px rgba(180,140,255,.4)}
.card h2{margin:0 0 8px;font-weight:400;font-size:28px}
.card p{margin:0 0 16px;font-size:16px;line-height:1.5}
button{font:inherit;font-size:20px;color:#fff;background:linear-gradient(135deg,#ff8fcf,#a58bff);border:0;border-radius:999px;padding:11px 30px;cursor:pointer;box-shadow:0 6px 18px rgba(255,120,200,.5);transition:transform .15s}
button:active{transform:scale(.93)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>✨ 샤방 땅따먹기</h1>
  <div class="hud"><span class="chip" id="pct">🌸 0%</span><span class="chip" id="kills">💥 0</span></div>
</header>
<div id="wrap">
  <canvas id="c" aria-label="땅따먹기 게임 화면"></canvas>
  <div id="ov"><div class="card" id="card">
    <h2 id="ct">샤방 땅따먹기</h2>
    <p id="cp">스와이프나 방향키(WASD)로 움직여요.<br>내 땅에서 나가 한 바퀴 돌아오면 그 안이 내 땅!<br>꼬리가 잘리면 끝이니 조심해요 💦</p>
    <button id="go">시작하기</button>
  </div></div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),x=cv.getContext('2d'),wrap=document.getElementById('wrap');
var COLS,ROWS,CS,own,trail,ents,parts=[],kills=0,running=false,best=0,last=0,TICK=115;
var COL=[null,{h:325,n:'나'},{h:205},{h:155},{h:45}];
var DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function rnd(a,b){return a+Math.random()*(b-a)}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function setup(){
  var W=wrap.clientWidth-16,H=wrap.clientHeight-8;
  CS=Math.max(14,Math.floor(Math.min(W/22,H/32)));
  COLS=Math.min(46,Math.floor(W/CS));ROWS=Math.min(64,Math.floor(H/CS));
  cv.width=COLS*CS;cv.height=ROWS*CS;
}
function idx(c,r){return r*COLS+c}
function claim(e,cx,cy,rad){for(var r=cy-rad;r<=cy+rad;r++)for(var c=cx-rad;c<=cx+rad;c++)if(c>=0&&r>=0&&c<COLS&&r<ROWS)own[idx(c,r)]=e.id}
function free(cx,cy,rad){for(var r=cy-rad;r<=cy+rad;r++)for(var c=cx-rad;c<=cx+rad;c++){if(c<0||r<0||c>=COLS||r>=ROWS||own[idx(c,r)]||trail[idx(c,r)])return false}return true}
function spawn(e){
  for(var i=0;i<80;i++){var cx=2+Math.floor(Math.random()*(COLS-4)),cy=2+Math.floor(Math.random()*(ROWS-4));
    if(e.id===1){cx=Math.floor(COLS/2);cy=ROWS-4}
    if(free(cx,cy,2)||(e.id===1&&i>70)){claim(e,cx,cy,1);e.x=e.ox=cx;e.y=e.oy=cy;e.hx=cx;e.hy=cy;e.alive=true;e.trail=[];e.dx=e.dy=0;e.nx=e.ny=0;e.mode=0;e.lim=6;return}}
  e.alive=false;e.respawn=40;
}
function newGame(){
  setup();own=new Uint8Array(COLS*ROWS);trail=new Uint8Array(COLS*ROWS);parts=[];kills=0;
  ents=[];for(var i=1;i<=4;i++){var e={id:i,alive:false,trail:[],respawn:0};ents.push(e);spawn(e)}
  document.getElementById('kills').textContent='💥 0';
}
function kill(v,by){
  if(!v.alive)return;v.alive=false;
  for(var i=0;i<v.trail.length;i++)trail[v.trail[i]]=0;v.trail=[];
  for(var i=0;i<own.length;i++)if(own[i]===v.id){own[i]=0;if(i%3===0)burst((i%COLS)+.5,Math.floor(i/COLS)+.5,COL[v.id].h,1)}
  burst(v.x+.5,v.y+.5,COL[v.id].h,24);
  if(v.id===1){over()}else{v.respawn=Math.round(2200/TICK);if(by===1){kills++;document.getElementById('kills').textContent='💥 '+kills}}
}
function burst(px,py,h,n){for(var i=0;i<n;i++){var a=rnd(0,6.28),s=rnd(.05,.35);parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h})}}
function close(e){
  for(var i=0;i<e.trail.length;i++){own[e.trail[i]]=e.id;trail[e.trail[i]]=0}
  var tl=e.trail.length;e.trail=[];
  var seen=new Uint8Array(COLS*ROWS),st=[];
  function push(c,r){var k=idx(c,r);if(!seen[k]&&own[k]!==e.id){seen[k]=1;st.push(k)}}
  for(var c=0;c<COLS;c++){push(c,0);push(c,ROWS-1)}
  for(var r=0;r<ROWS;r++){push(0,r);push(COLS-1,r)}
  while(st.length){var k=st.pop(),c=k%COLS,r=(k-c)/COLS;
    if(c>0)push(c-1,r);if(c<COLS-1)push(c+1,r);if(r>0)push(c,r-1);if(r<ROWS-1)push(c,r+1)}
  var gained=0;
  for(var k=0;k<own.length;k++){if(!seen[k]&&own[k]!==e.id){
    if(trail[k]&&trail[k]!==e.id){var v=ents[trail[k]-1];kill(v,e.id)}
    own[k]=e.id;gained++;if(gained%2===0)burst((k%COLS)+.5,Math.floor(k/COLS)+.5,COL[e.id].h,1)}}
  if(e.id===1&&gained+tl>8)burst(e.x+.5,e.y+.5,COL[1].h,16);
}
function botThink(e){
  var own1=own[idx(e.x,e.y)]===e.id;
  if(own1){if(e.mode===1){e.mode=0}if(e.mode===0&&Math.random()<.25){e.mode=2;e.lim=Math.floor(rnd(4,13))}}
  else if(e.mode===2&&e.trail.length>e.lim)e.mode=1;
  var cand=[];
  for(var i=0;i<4;i++){var d=DIRS[i];if(d[0]===-e.dx&&d[1]===-e.dy&&(e.dx||e.dy))continue;
    var nx=e.x+d[0],ny=e.y+d[1];if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
    if(trail[idx(nx,ny)]===e.id)continue;cand.push(d)}
  if(!cand.length){return}
  var pick;
  if(e.mode===1){var hx=e.hx,hy=e.hy,bd=1e9;
    for(var i=0;i<cand.length;i++){var dd=Math.abs(e.x+cand[i][0]-hx)+Math.abs(e.y+cand[i][1]-hy);if(dd<bd){bd=dd;pick=cand[i]}}}
  else{
    var cur=null;for(var i=0;i<cand.length;i++)if(cand[i][0]===e.dx&&cand[i][1]===e.dy)cur=cand[i];
    pick=(cur&&Math.random()<.8)?cur:cand[Math.floor(Math.random()*cand.length)];
    if(e.mode===0){var out=cand.filter(function(d){return own[idx(e.x+d[0],e.y+d[1])]!==e.id});if(out.length&&Math.random()<.5)pick=out[Math.floor(Math.random()*out.length)]}}
  e.dx=pick[0];e.dy=pick[1];
}
function tick(){
  for(var n=0;n<ents.length;n++){var e=ents[n];
    if(!e.alive){if(e.id!==1&&--e.respawn<=0)spawn(e);continue}
    if(e.id===1){if(e.nx||e.ny){if(!((e.nx===-e.dx&&e.ny===-e.dy)&&e.trail.length)){e.dx=e.nx;e.dy=e.ny}}}
    else botThink(e);
    e.ox=e.x;e.oy=e.y;
    if(!e.dx&&!e.dy)continue;
    var nx=e.x+e.dx,ny=e.y+e.dy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS){if(e.id===1){e.dx=e.dy=0}continue}
    var k=idx(nx,ny),tv=trail[k];
    if(tv){var v=ents[tv-1];if(tv===e.id){kill(e,0);continue}kill(v,e.id);if(!e.alive)continue}
    e.x=nx;e.y=ny;
    if(own[k]===e.id){if(e.trail.length)close(e);else{e.hx=nx;e.hy=ny}}
    else{trail[k]=e.id;e.trail.push(k)}
  }
  var cnt=[0,0,0,0,0];for(var i=0;i<own.length;i++)cnt[own[i]]++;
  var p=Math.round(cnt[1]/own.length*100);if(p>best)best=p;
  document.getElementById('pct').textContent='🌸 '+p+'%';
  tick.p=p;
  if(p===100&&ents[0].alive){over()}
}
function hsl(h,s,l,a){return 'hsla('+h+','+s+'%,'+l+'%,'+(a===undefined?1:a)+')'}
function star(px,py,s,rot){x.beginPath();for(var i=0;i<8;i++){var r=i%2?s*.3:s,a=rot+i*Math.PI/4;x.lineTo(px+Math.cos(a)*r,py+Math.sin(a)*r)}x.closePath();x.fill()}
function draw(now){
  var a=Math.min(1,(now-last)/TICK);
  x.clearRect(0,0,cv.width,cv.height);
  x.fillStyle=css('--board')||'#fff8fd';x.fillRect(0,0,cv.width,cv.height);
  x.strokeStyle=css('--grid');x.lineWidth=1;x.beginPath();
  for(var c=1;c<COLS;c++){x.moveTo(c*CS+.5,0);x.lineTo(c*CS+.5,cv.height)}
  for(var r=1;r<ROWS;r++){x.moveTo(0,r*CS+.5);x.lineTo(cv.width,r*CS+.5)}
  x.stroke();
  var dark=(css('--ink')||'').toLowerCase()==='#ffeaff';
  for(var k=0;k<own.length;k++){var o=own[k],t=trail[k];if(!o&&!t)continue;
    var c=k%COLS,r=(k-c)/COLS,id=t||o,h=COL[id].h;
    if(t){x.fillStyle=hsl(h,95,dark?65:72,.75);x.fillRect(c*CS+1,r*CS+1,CS-2,CS-2)}
    else{x.fillStyle=hsl(h,90,dark?48:82);x.fillRect(c*CS,r*CS,CS,CS);
      x.fillStyle='rgba(255,255,255,'+(dark?.1:.35)+')';x.fillRect(c*CS+2,r*CS+2,CS-4,CS*.28)}
  }
  for(var n=0;n<ents.length;n++){var e=ents[n];if(!e.alive)continue;
    var px=(e.ox+(e.x-e.ox)*a+.5)*CS,py=(e.oy+(e.y-e.oy)*a+.5)*CS,h=COL[e.id].h,R=CS*.55;
    var g=x.createRadialGradient(px,py,0,px,py,R*2.2);g.addColorStop(0,hsl(h,100,80,.7));g.addColorStop(1,hsl(h,100,80,0));
    x.fillStyle=g;x.fillRect(px-R*2.2,py-R*2.2,R*4.4,R*4.4);
    x.fillStyle=hsl(h,95,dark?72:66);x.beginPath();x.arc(px,py,R,0,6.283);x.fill();
    x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(px-R*.3,py-R*.25,R*.22,0,6.283);x.fill();
    x.fillStyle=hsl(h,50,30);x.beginPath();x.arc(px-R*.25,py-R*.22,R*.1,0,6.283);x.arc(px+R*.25,py-R*.22,R*.1,0,6.283);x.fill();
    if(e.id===1){x.fillStyle='#fff';star(px+R*.9,py-R*1.1,R*.5,now/400)}
  }
  for(var i=parts.length-1;i>=0;i--){var s=parts[i];s.x+=s.vx;s.y+=s.vy;s.l-=.03;if(s.l<=0){parts.splice(i,1);continue}
    x.fillStyle=hsl(s.h,100,dark?80:70,s.l);star(s.x*CS,s.y*CS,CS*.35*s.l+1,s.l*5)}
}
function loop(now){
  if(running){if(now-last>=TICK){last=now;tick()}draw(now)}
  requestAnimationFrame(loop)}
function over(){
  running=false;
  document.getElementById('ct').textContent='앗, 꼬리가 잘렸어요 💦';
  document.getElementById('cp').innerHTML='내 땅 '+(tick.p||0)+'% · 처치 '+kills+'<br>최고 기록 '+best+'%';
  document.getElementById('go').textContent='다시 도전';
  document.getElementById('ov').classList.remove('hide');
}
document.getElementById('go').onclick=function(){
  document.getElementById('ov').classList.add('hide');newGame();last=performance.now();running=true;
};
var KEY={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1],d:[1,0],a:[-1,0],s:[0,1],w:[0,-1]};
addEventListener('keydown',function(ev){var d=KEY[ev.key];if(d&&ents){ents[0].nx=d[0];ents[0].ny=d[1];ev.preventDefault()}});
var sx,sy,mx=0,my=0;
cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});
cv.addEventListener('pointermove',function(e){
  mx=e.clientX;my=e.clientY;
  if(sx===undefined||!ents)return;var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  var d=Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1];
  ents[0].nx=d[0];ents[0].ny=d[1];sx=e.clientX;sy=e.clientY});
addEventListener('mousemove',function(e){
  if(!ents||!ents[0].alive)return;
  var rect=cv.getBoundingClientRect();
  var cx=ents[0].x*CS+CS/2,cy=ents[0].y*CS+CS/2;
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var dx=mx-cx,dy=my-cy;
  if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  var d=Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1];
  ents[0].nx=d[0];ents[0].ny=d[1];
});
addEventListener('pointerup',function(){sx=undefined});
addEventListener('resize',function(){if(!running&&ents){setup();own=new Uint8Array(COLS*ROWS);trail=new Uint8Array(COLS*ROWS);for(var i=0;i<ents.length;i++)ents[i].alive=false}});
setup();own=new Uint8Array(COLS*ROWS);trail=new Uint8Array(COLS*ROWS);ents=[];
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
